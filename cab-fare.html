
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cab Fare Settings | PMS Tour & Travels</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fb; color: #172033; }
    header { background: #102c54; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 21px; }
    header p { margin: 6px 0 0; font-size: 13px; }
    main { max-width: 650px; margin: 28px auto; padding: 0 15px; }
    .card { background: white; padding: 22px; border-radius: 14px; box-shadow: 0 4px 18px #0000000b; }
    label { display: block; font-weight: 700; margin: 18px 0 7px; }
    input { width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; }
    button, .link { display: inline-block; padding: 12px 16px; border: 0; border-radius: 8px; background: #e5a400; color: #172033; font-weight: 700; cursor: pointer; text-decoration: none; }
    .secondary { background: #e8eef7; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .message { margin-top: 16px; white-space: pre-wrap; }
    .muted { color: #64748b; font-size: 13px; line-height: 1.5; }
    .price { font-size: 26px; font-weight: 800; color: #0f766e; }
  </style>
</head>
<body>
<header>
  <div>
    <h1>PMS TOUR &amp; TRAVELS</h1>
    <p>Owner Cab Fare Settings</p>
  </div>
  <a class="link secondary" href="dashboard.html">← Dashboard</a>
</header>

<main>
  <section class="card">
    <h2>Suzuki Ertiga Tour M</h2>
    <p class="muted">Customer cab-booking page-க்கான per-kilometre rate-ஐ இங்கே மாற்றலாம்.</p>

    <label for="rate">Rate per kilometre (₹)</label>
    <input id="rate" type="number" min="1" max="1000" step="0.5" value="18">

    <label for="minimumFare">Minimum fare (₹)</label>
    <input id="minimumFare" type="number" min="0" max="100000" step="1" value="300">

    <p>Current rate: <span class="price" id="preview">₹18/km</span></p>

    <div class="actions">
      <button id="saveBtn" type="button">Save Rate</button>
      <button id="reloadBtn" class="secondary" type="button">Reload Rate</button>
    </div>
    <p id="message" class="message" role="status"></p>
    <p class="muted">Changes are saved to Supabase. Customer cab page must read the same table to use updated rates.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(() => {
  const OWNER_EMAIL = 'pmstravels@gmail.com';
  const rateInput = document.getElementById('rate');
  const minimumInput = document.getElementById('minimumFare');
  const preview = document.getElementById('preview');
  const message = document.getElementById('message');
  const saveBtn = document.getElementById('saveBtn');
  const reloadBtn = document.getElementById('reloadBtn');

  if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) {
    message.textContent = 'Supabase config could not be loaded. Check supabase-config.js path.';
    saveBtn.disabled = true;
    return;
  }

  const client = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_PUBLISHABLE_KEY
  );

  function updatePreview() {
    preview.textContent = '₹' + (Number(rateInput.value) || 0).toLocaleString('en-IN') + '/km';
  }

  async function checkOwner() {
    const { data: { session }, error } = await client.auth.getSession();
    const email = session?.user?.email?.toLowerCase();

    if (error || !session || email !== OWNER_EMAIL) {
      await client.auth.signOut();
      location.href = 'login.html';
      return false;
    }
    return true;
  }

  async function loadRate() {
    message.textContent = 'Loading saved rate...';
    saveBtn.disabled = true;

    if (!await checkOwner()) return;

    const { data, error } = await client
      .from('cab_rates')
      .select('id, vehicle_name, rate_per_km, minimum_fare')
      .eq('vehicle_name', 'Suzuki Ertiga Tour M')
      .limit(1)
      .maybeSingle();

    if (error) {
      message.textContent = 'Could not load rate: ' + error.message;
      saveBtn.disabled = false;
      return;
    }

    if (!data) {
      message.textContent = 'No rate row found. Check that the cab_rates SQL setup was run.';
      saveBtn.disabled = false;
      return;
    }

    rateInput.value = data.rate_per_km;
    minimumInput.value = data.minimum_fare;
    updatePreview();
    message.textContent = 'Saved rate loaded successfully.';
    saveBtn.disabled = false;
  }

  async function saveRate() {
    if (!await checkOwner()) return;

    const rate = Number(rateInput.value);
    const minimumFare = Number(minimumInput.value);

    if (!Number.isFinite(rate) || rate < 1 || rate > 1000) {
      message.textContent = 'Rate ₹1 முதல் ₹1000/km வரை இருக்க வேண்டும்.';
      return;
    }
    if (!Number.isFinite(minimumFare) || minimumFare < 0 || minimumFare > 100000) {
      message.textContent = 'Minimum fare சரியாக உள்ளிடவும்.';
      return;
    }

    saveBtn.disabled = true;
    message.textContent = 'Saving...';

    const { data: existing, error: readError } = await client
      .from('cab_rates')
      .select('id')
      .eq('vehicle_name', 'Suzuki Ertiga Tour M')
      .limit(1)
      .maybeSingle();

    if (readError) {
      message.textContent = 'Could not check current rate: ' + readError.message;
      saveBtn.disabled = false;
      return;
    }

    let result;
    if (existing) {
      result = await client
        .from('cab_rates')
        .update({
          rate_per_km: rate,
          minimum_fare: minimumFare,
          updated_at: new Date().toISOString()
        })
        .eq('id', existing.id);
    } else {
      result = await client
        .from('cab_rates')
        .insert({
          vehicle_name: 'Suzuki Ertiga Tour M',
          rate_per_km: rate,
          minimum_fare: minimumFare
        });
    }

    if (result.error) {
      message.textContent = 'Save failed: ' + result.error.message;
    } else {
      message.textContent = 'Rate saved successfully: ₹' + rate + '/km';
      updatePreview();
    }
    saveBtn.disabled = false;
  }

  rateInput.addEventListener('input', updatePreview);
  saveBtn.addEventListener('click', saveRate);
  reloadBtn.addEventListener('click', loadRate);
  loadRate();
})();
</script>
</body>
</html>
