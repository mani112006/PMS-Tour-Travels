<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMS Owner Login</title>
  <link rel="stylesheet" href="owner.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">PMS TOUR &amp; TRAVELS</div>
    <h1>Owner Login</h1>
    <p class="muted">Sign in to manage customer booking requests.</p>
    <form id="loginForm" novalidate>
      <label>Email<input id="email" type="email" autocomplete="username" required placeholder="Owner email"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Password"></label>
      <button id="loginBtn" type="submit">Login</button>
      <p id="loginMessage" class="message" role="alert"></p>
    </form>
    <a class="back" href="../index.html">← Back to website</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script>
    const OWNER_EMAIL = 'pmstourtravels@gmail.com';
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMessage');

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user?.email?.toLowerCase() === OWNER_EMAIL) location.href = 'dashboard.html';
    }
    init();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (!email || !password) { msg.textContent = 'Enter email and password.'; return; }
      if (email !== OWNER_EMAIL) { msg.textContent = 'This account is not authorized as PMS owner.'; return; }
      btn.disabled = true; btn.textContent = 'Signing in...';
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = error.message || 'Login failed.';
        btn.disabled = false; btn.textContent = 'Login';
        return;
      }
      location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
