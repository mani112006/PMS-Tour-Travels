    const OWNER_EMAIL = 'pmstravels@gmail.com';

let allBookings = [];
    const reviewList = document.getElementById('reviews');
const reviewMsg = document.getElementById('reviewDashMessage');

async function loadReviews() {
  reviewMsg.textContent = 'Loading reviews...';

  const { data, error } = await supabaseClient
    .from('reviews')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    reviewMsg.textContent = error.message;
    return;
  }

  const rows = data || [];

  if (!rows.length) {
    reviewList.innerHTML = '<div class="empty">No customer reviews yet.</div>';
    reviewMsg.textContent = '';
    return;
  }

  reviewList.innerHTML = rows.map(r => `
    <article class="booking-card">
      <div class="booking-head">
        <div>
          <strong>${esc(r.customer_name)}</strong>
          <div class="small">
            ${esc(r.created_at ? new Date(r.created_at).toLocaleString('en-IN') : '')}
          </div>
        </div>
        <span class="badge ${statusClass(r.status)}">
          ${esc(r.status || 'pending')}
        </span>
      </div>

      <div class="grid">
        <div>
          <b>Rating</b>
          <span>${'⭐'.repeat(Number(r.rating) || 0)}</span>
        </div>

        <div class="wide">
          <b>Review</b>
          <span>${esc(r.review_message)}</span>
        </div>
      </div>

      <div class="actions">
        ${
          r.status === 'pending'
          ? `
            <button class="confirm review-status"
              data-review-id="${r.id}"
              data-review-status="approved">
              ✓ Approve
            </button>

            <button class="reject review-status"
              data-review-id="${r.id}"
              data-review-status="rejected">
              ✕ Reject
            </button>
          `
          : ''
        }
      </div>
    </article>
  `).join('');

  reviewMsg.textContent = '';
}

async function updateReviewStatus(id, status) {
  const label = status === 'approved' ? 'Approve' : 'Reject';

  if (!confirm(`${label} this review?`)) return;

  const { error } = await supabaseClient
    .from('reviews')
    .update({ status })
    .eq('id', id);

  if (error) {
    reviewMsg.textContent = error.message;
    return;
  }

  await loadReviews();
}

    function esc(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    
function formatTime(time) {
  if (!time) return '';
  const [hour, minute] = time.split(':');
  const h = Number(hour);
  const suffix = h >= 12 ? 'PM' : 'AM';
  const hour12 = h % 12 || 12;
  return `${hour12}:${minute} ${suffix}`;
}

    function showMsg(text, bad=false) {
      msg.textContent = text || '';
      msg.className = 'message' + (bad ? ' error' : '');
    }
    function statusClass(s) { return String(s || 'pending').toLowerCase(); }

    function whatsappNumber(phone) {
      let digits = String(phone || '').replace(/\D/g, '');
      if (digits.length === 10) digits = '91' + digits;
      return digits;
    }

    function bookingMessage(r, status) {
      const code = r.booking_code || ('Booking #' + r.id);
      const customer = r.customer_name || 'Customer';
      if (status === 'confirmed') {
        return `Hello ${customer},\n\nYour PMS Tour & Travels booking request has been CONFIRMED. ✅\n\nBooking ID: ${code}\nTrip: ${r.trip_type || '-'}\nPickup: ${r.pickup_location || '-'}\nDrop: ${r.drop_location || '-'}\nDate: ${r.start_date || '-'}\nTime: ${formatTime(r.start_time) || '-'}\nPassengers: ${r.passengers || '-'}\n\nThank you for choosing PMS Tour & Travels.\nYOUR JOURNEY | OUR PRIORITY`;
      }
      return `Hello ${customer},\n\nYour PMS Tour & Travels booking request has been REJECTED. ❌\n\nBooking ID: ${code}\nTrip: ${r.trip_type || '-'}\nPickup: ${r.pickup_location || '-'}\nDrop: ${r.drop_location || '-'}\nDate: ${r.start_date || '-'}\n\nPlease contact PMS Tour & Travels at 8940366879 if you need any clarification.\nThank you.`;
    }

    function openWhatsApp(r, status) {
      const number = whatsappNumber(r.phone);
      if (!number || number.length < 10) {
        showMsg('Customer WhatsApp number is invalid.', true);
        return;
      }
      const message = status ? bookingMessage(r, status) : `Hello ${r.customer_name || 'Customer'}, this is PMS Tour & Travels regarding your booking ${r.booking_code || ('#' + r.id)}.`;
      window.open(`https://wa.me/${number}?text=${encodeURIComponent(message)}`, '_blank', 'noopener');
    }

    async function guard() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const email = session?.user?.email?.toLowerCase();
      if (!session || email !== OWNER_EMAIL) {
        await supabaseClient.auth.signOut();
        location.href = 'login.html';
        return false;
      }
      document.getElementById('ownerEmail').textContent = email;
      return true;
    }

    async function loadBookings() {
  showMsg('Loading bookings...');

  const { data, error } = await supabaseClient
    .from('Booking')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    showMsg(error.message || 'Could not load bookings.', true);
    list.innerHTML = '';
    return;
  }

  allBookings = data || [];

  // Dashboard statistics
  document.getElementById('totalCount').textContent = allBookings.length;
  document.getElementById('pendingCount').textContent =
    allBookings.filter(r => r.status === 'pending').length;
  document.getElementById('confirmedCount').textContent =
    allBookings.filter(r => r.status === 'confirmed').length;
  document.getElementById('rejectedCount').textContent =
    allBookings.filter(r => r.status === 'rejected').length;

  renderBookings();
}

function renderBookings() {
  const searchText = (bookingSearch.value || '').trim().toLowerCase();
  const filterStatus = bookingFilter.value;
  const filterDate = bookingDateFilter.value;

  const filteredRows = allBookings.filter(r => {
    const matchesSearch =
      !searchText ||
      String(r.customer_name || '').toLowerCase().includes(searchText) ||
      String(r.phone || '').toLowerCase().includes(searchText) ||
      String(r.booking_code || '').toLowerCase().includes(searchText);

   const matchesStatus =
  filterStatus === 'all' ||
  String(r.status || 'pending').toLowerCase() === filterStatus;

const matchesDate = (() => {
  if (filterDate === 'all') return true;
  if (!r.start_date) return false;

  const bookingDate = new Date(r.start_date + 'T00:00:00');
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  if (filterDate === 'today') {
    return bookingDate.getTime() === today.getTime();
  }

  if (filterDate === 'tomorrow') {
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate() + 1);
    return bookingDate.getTime() === tomorrow.getTime();
  }

  if (filterDate === 'week') {
    const weekEnd = new Date(today);
    weekEnd.setDate(today.getDate() + 7);
    return bookingDate >= today && bookingDate < weekEnd;
  }

  return true;
})();

return matchesSearch && matchesStatus && matchesDate;
  });

  if (!filteredRows.length) {
    list.innerHTML = '<div class="empty">No matching bookings found.</div>';
    showMsg('');
    return;
  }

  list.innerHTML = filteredRows.map(r => {
    const waAction = r.status === 'confirmed'
      ? `<button class="wa" data-wa-status="confirmed" data-id="${r.id}">✓ Send Confirmation WhatsApp</button>`
      : r.status === 'rejected'
        ? `<button class="wa" data-wa-status="rejected" data-id="${r.id}">✕ Send Rejection WhatsApp</button>`
        : `<button class="wa" data-wa-status="" data-id="${r.id}">WhatsApp Customer</button>`;

    return `
      <article class="booking-card">
        <div class="booking-head">
          <div>
            <strong>${esc(r.booking_code || ('Booking #' + r.id))}</strong>
            <div class="small">
              ${esc(r.created_at ? new Date(r.created_at).toLocaleString('en-IN') : '')}
            </div>
          </div>

          <span class="badge ${statusClass(r.status)}">
            ${esc(r.status || 'pending')}
          </span>
        </div>

        <div class="grid">
          <div><b>Customer</b><span>${esc(r.customer_name)}</span></div>
          <div><b>Phone</b><span>${esc(r.phone)}</span></div>
          <div><b>Trip</b><span>${esc(r.trip_type)}</span></div>
          <div><b>Days</b><span>${esc(r.number_of_days ?? '')}</span></div>
          <div><b>Pickup</b><span>${esc(r.pickup_location)}</span></div>
          <div><b>Drop</b><span>${esc(r.drop_location)}</span></div>
          <div><b>Date</b><span>${esc(r.start_date)}</span></div>
          <div><b>Time</b><span>${formatTime(r.start_time)}</span></div>
          <div><b>Passengers</b><span>${esc(r.passengers)}</span></div>
          <div><b>Service</b><span>${esc(r.service_type)}</span></div>
          <div class="wide"><b>Destinations</b><span>${esc(r.destinations)}</span></div>
          <div class="wide"><b>Additional details</b><span>${esc(r.additional_details)}</span></div>
        </div>

        <div class="actions">
          <button class="secondary view-details" data-id="${r.id}">👁️ View Details</button>
          <a class="call" href="tel:${encodeURIComponent(r.phone || '')}">📞 Call</a>
          ${waAction}

          ${
            r.status === 'pending'
              ? `<button class="confirm" data-id="${r.id}" data-status="confirmed">✓ Confirm</button>
                 <button class="reject" data-id="${r.id}" data-status="rejected">✕ Reject</button>`
              : ''
          }
        </div>
      </article>
    `;
  }).join('');

  showMsg('');
}

  }

  const status = String(booking.status || 'pending');

  bookingDetailsContent.innerHTML = `

      <div><b>Status</b><span>${esc(status)}</span></div>

      <div><b>Phone</b><span>${esc(booking.phone)}</span></div>
      <div><b>Trip Type</b><span>${esc(booking.trip_type)}</span></div>
      <div><b>Days</b><span>${esc(booking.number_of_days ?? '')}</span></div>
      <div><b>Pickup</b><span>${esc(booking.pickup_location)}</span></div>
      <div><b>Drop</b><span>${esc(booking.drop_location)}</span></div>
      <div><b>Date</b><span>${esc(booking.start_date)}</span></div>
      <div><b>Time</b><span>${formatTime(booking.start_time)}</span></div>
      <div><b>Passengers</b><span>${esc(booking.passengers)}</span></div>
      <div><b>Service</b><span>${esc(booking.service_type)}</span></div>

  document.getElementById('detailsWhatsAppBtn')

  document.getElementById('detailsConfirmBtn')
    ?.addEventListener('click', async () => {

      await updateStatus(booking.id, 'confirmed');
    });

  document.getElementById('detailsRejectBtn')
    ?.addEventListener('click', async () => {
      bookingDetailsModal.style.display = 'none';
      await updateStatus(booking.id, 'rejected');
    });
}

function exportBookings() {
  if (!allBookings.length) {
    showMsg('No bookings available to export.', true);
    return;
  }

  if (typeof XLSX === 'undefined') {
    showMsg('Excel export library could not be loaded. Please refresh and try again.', true);
    return;
  }

  const headers = [
    'Booking ID',
    'Customer Name',
    'Phone',
    'Trip Type',
    'Days',
    'Pickup',
    'Drop',
    'Date',
    'Time',
    'Passengers',
    'Service',
    'Destinations',
    'Additional Details',
    'Status'
  ];

  const rows = allBookings.map(r => [
    String(r.booking_code || ''),
    String(r.customer_name || ''),
    String(r.phone || ''),
    String(r.trip_type || ''),
    r.number_of_days ?? '',
    String(r.pickup_location || ''),
    String(r.drop_location || ''),
    String(r.start_date || ''),
    String(formatTime(r.start_time) || ''),
    r.passengers ?? '',
    String(r.service_type || ''),
    String(r.destinations || ''),
    String(r.additional_details || ''),
    String(r.status || 'pending')
  ]);

  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);

  // Keep phone numbers and date/time as text.
  for (let row = 2; row <= rows.length + 1; row++) {
    ['C', 'H', 'I'].forEach(col => {
      const cell = ws[`${col}${row}`];
      if (cell) {
        cell.t = 's';
        cell.v = String(cell.v || '');
      }
    });
  }

  // Professional column widths.
  ws['!cols'] = [
    { wch: 22 },
    { wch: 22 },
    { wch: 16 },
    { wch: 14 },
    { wch: 8 },
    { wch: 22 },
    { wch: 22 },
    { wch: 14 },
    { wch: 12 },
    { wch: 12 },
    { wch: 24 },
    { wch: 28 },
    { wch: 42 },
    { wch: 14 }
  ];

  // Enable Excel filter.
  ws['!autofilter'] = {
    ref: `A1:N${rows.length + 1}`
  };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Bookings');

  XLSX.writeFile(
    wb,
    `PMS-Bookings-${new Date().toISOString().slice(0, 10)}.xlsx`
  );

  showMsg('Excel file exported successfully.');
}

        return;
      }

    });

        return;

      cancellationList.innerHTML = rows.map(r => `

            <div>

    async function updateCancellationStatus(id, status) {
      const label = status === 'approved' ? 'Approve' : 'Reject';

      if (!confirm(`${label} this cancellation request?`)) return;

      const { data: request, error: requestError } = await supabaseClient
        .from('cancellation_requests')
        .select('booking_code')
        .eq('id', id)
        .single();

      if (requestError || !request) {
        cancellationMsg.textContent = 'Could not load cancellation request.';
        return;
      }

      const { error } = await supabaseClient
        .from('cancellation_requests')
        .update({ status })
        .eq('id', id);

      if (error) {
        cancellationMsg.textContent = error.message || 'Cancellation status update failed.';
        return;
      }

      // If owner approves the cancellation, mark the original booking as cancelled.
      if (status === 'approved') {
        const { error: bookingError } = await supabaseClient
          .from('Booking')
          .update({ status: 'cancelled' })
          .eq('booking_code', request.booking_code);

        if (bookingError) {
          cancellationMsg.textContent =
            'Cancellation request approved, but booking status could not be updated.';
          await loadCancellationRequests();
          await loadBookings();
          return;
        }
      }

      await loadCancellationRequests();
      await loadBookings();

      cancellationMsg.textContent =
        `Cancellation ${status === 'approved' ? 'approved' : 'rejected'} successfully.`;
    }

    cancellationList.addEventListener('click', e => {
      const button = e.target.closest('.cancellation-status');
      if (button) {
        updateCancellationStatus(
          button.dataset.id,
          button.dataset.status
        );
        return;
      }

      const wa = e.target.closest('.cancellation-wa');
      if (wa) {
        const number = whatsappNumber(wa.dataset.phone);
        if (!number || number.length < 10) {
          cancellationMsg.textContent = 'Customer WhatsApp number is invalid.';
          return;
        }

        const message =
          `Hello, this is PMS Tour & Travels regarding your cancellation request for Booking ID ${wa.dataset.bookingCode}.`;

        window.open(
          `https://wa.me/${number}?text=${encodeURIComponent(message)}`,
          '_blank',
          'noopener'
        );
      }
    });

    document.getElementById('refreshCancellationsBtn')
      .addEventListener('click', loadCancellationRequests);

    (async () => {
      if (await guard()) {
  await loadBookings();
  await loadReviews();
  await loadCancellationRequests();
}
    })();
  </script>
</body>
</html>
